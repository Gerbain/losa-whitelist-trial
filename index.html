<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Discord Gate</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }

        

        /* OVERLAY - starts visible for debugging */
        #overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(4,5,9,0.87);
            z-index: 9999;
        }
        #overlay.hidden { display: none; }

        .card {
            background: #13161c;
            border: 1px solid #1e2229;
            border-radius: 16px;
            padding: 36px 40px 30px;
            width: 460px; max-width: 90vw;
            box-shadow: 0 0 60px rgba(88,101,242,0.2), 0 24px 64px rgba(0,0,0,0.7);
            text-align: center;
            color: #e8eaf0;
            font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
        }

        .top-bar {
            position: absolute; top: 0; left: 32px; right: 32px; height: 3px;
            background: linear-gradient(90deg, transparent, #5865F2, transparent);
        }

        .icon-wrap {
            width: 60px; height: 60px;
            background: rgba(88,101,242,0.18);
            border: 1px solid rgba(88,101,242,0.35);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 14px;
        }
        .discord-svg { width: 30px; height: 30px; fill: #5865F2; }

        .server-label { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #5865F2; margin-bottom: 6px; }
        .title { font-size: 26px; font-weight: 800; margin-bottom: 10px; }
        .message { font-size: 14px; color: #8b909e; line-height: 1.55; margin-bottom: 4px; }
        .sub-message { font-size: 13px; color: #555b6a; line-height: 1.5; margin-bottom: 22px; }

        .steps { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
        .step { display: flex; align-items: center; gap: 12px; background: #1a1d24; border: 1px solid #1e2229; border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #8b909e; text-align: left; }
        .step strong { color: #e8eaf0; }
        .step-num { min-width: 24px; height: 24px; background: rgba(88,101,242,0.18); border: 1px solid rgba(88,101,242,0.35); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #5865F2; }

        .link-box { display: flex; align-items: center; gap: 10px; background: #1a1d24; border: 1px solid #272b35; border-radius: 10px; padding: 10px 12px 10px 16px; margin-bottom: 14px; }
        .link-text { flex: 1; font-size: 13px; color: #e8eaf0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; font-family: monospace; }
        .copy-btn { display: flex; align-items: center; gap: 6px; background: rgba(88,101,242,0.18); border: 1px solid rgba(88,101,242,0.35); border-radius: 7px; color: #5865F2; font-size: 12px; font-weight: 600; padding: 6px 12px; cursor: pointer; font-family: inherit; }
        .copy-btn.copied { background: rgba(59,165,93,0.2); border-color: rgba(59,165,93,0.4); color: #3ba55d; }

        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; text-decoration: none; }
        .btn-discord { background: #5865F2; color: #fff; }
        .btn-recheck { background: #1a1d24; border: 1px solid #272b35; color: #e8eaf0; }
        .btn-recheck:disabled { opacity: 0.45; cursor: not-allowed; }
        .spinning svg { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer-note { font-size: 12px; color: #555b6a; line-height: 1.5; }
    </style>
</head>
<body>



<div id="overlay" class="hidden">
    <div class="card" style="position:relative;">
        <div class="top-bar"></div>

        <div class="icon-wrap">
            <svg class="discord-svg" viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
            </svg>
        </div>

        <p class="server-label" id="serverName">DEBUG MODE</p>
        <h1 class="title">Members Only</h1>
        <p class="message" id="mainMessage">If you see this card, the NUI is rendering correctly.</p>
        <p class="sub-message" id="subMessage">Waiting for Lua message event...</p>

        <div class="steps">
            <div class="step"><span class="step-num">1</span><span>Join our Discord server</span></div>
            <div class="step"><span class="step-num">2</span><span>Get the <strong>Member</strong> role</span></div>
            <div class="step"><span class="step-num">3</span><span>Click <strong>Re-check</strong> below</span></div>
        </div>

        <div class="link-box">
            <span class="link-text" id="discordLinkText"></span>
            <button class="copy-btn" id="copyBtn" onclick="copyLink()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                <span id="copyLabel">Copy</span>
            </button>
        </div>

        <div class="actions">
            <a id="discordJoinBtn" href="#" class="btn btn-discord" onclick="openDiscord(event)">
                <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
                Join Discord
            </a>
            <button class="btn btn-recheck" id="recheckBtn" onclick="recheck()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                <span id="recheckLabel">I've Joined — Re-check</span>
            </button>
        </div>

        <p class="footer-note">Already have the role? Hit re-check and you'll be let in instantly.</p>
    </div>
</div>

<script>
    var discordLink = '';
    var isChecking = false;
    function log(msg) {
        console.log('[discord_gate] ' + msg);
    }

    log('Script running. DOM ready: ' + document.readyState);

    window.addEventListener('message', function(e) {
        var data = e.data;
        log('message received: ' + JSON.stringify(data).substring(0, 120));

        if (!data || !data.action) return;

        if (data.action === 'show') {
            discordLink = data.discordLink || discordLink;
            document.getElementById('serverName').textContent  = data.serverName || 'SERVER NAME';
            document.getElementById('mainMessage').textContent = data.message    || 'Trial ended.';
            document.getElementById('subMessage').textContent  = data.subMessage || 'Join Discord for access.';
            document.getElementById('discordJoinBtn').href     = discordLink;

            try {
                var url = new URL(discordLink);
                document.getElementById('discordLinkText').textContent = url.host + url.pathname;
            } catch(err) {
                document.getElementById('discordLinkText').textContent = discordLink;
            }

            document.getElementById('overlay').classList.remove('hidden');
            setChecking(false);
            log('show applied OK');

        } else if (data.action === 'hide') {
            document.getElementById('overlay').classList.add('hidden');
            setChecking(false);
            log('hide applied');

        } else if (data.action === 'checking') {
            setChecking(true);
            log('checking state');
        }
    });

    function setChecking(state) {
        isChecking = state;
        var btn = document.getElementById('recheckBtn');
        var label = document.getElementById('recheckLabel');
        btn.disabled = state;
        btn.classList.toggle('spinning', state);
        label.textContent = state ? 'Checking...' : "I've Joined — Re-check";
    }

    function recheck() {
        if (isChecking) return;
        setChecking(true);
        log('recheck triggered');
        fetch('https://discord_gate/recheck', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({})
        });
        setTimeout(function() { setChecking(false); }, 10000);
    }

    function openDiscord(e) {
        e.preventDefault();
        if (typeof invokeNative !== 'undefined') {
            invokeNative('openUrl', discordLink);
        }
    }

    function copyLink() {
        var btn = document.getElementById('copyBtn');
        var label = document.getElementById('copyLabel');
        navigator.clipboard.writeText(discordLink).then(function() {
            btn.classList.add('copied');
            label.textContent = 'Copied!';
            setTimeout(function() { btn.classList.remove('copied'); label.textContent = 'Copy'; }, 2000);
        });
    }
</script>
</body>
</html>
